---
reverse_proxy_package: caddy
reverse_proxy_service: caddy
reverse_proxy_config_file: /etc/caddy/Caddyfile
reverse_proxy_apt_cache_valid_time: 3600

# Backend to protect. In the single-VM MVP, Grafana runs on the same host.
# The same role can front Prometheus (:9090) or Alertmanager (:9093), which have
# no built-in authentication, by overriding this value.
reverse_proxy_backend_url: "http://127.0.0.1:3000"

# Name presented by the proxy and embedded in the internal-CA certificate.
# Defaults to the host address; override it when the lab is reached by a DNS name.
reverse_proxy_server_name: "{{ ansible_host | default(ansible_default_ipv4.address) }}"

reverse_proxy_http_port: 80
reverse_proxy_https_port: 443

# HTTP basic authentication. No password default ships with the role on purpose:
# it must be provided at deploy time (for example in a git-ignored secrets.local.yml
# or via Ansible Vault). The bcrypt hash is generated once by Caddy and stored in
# the file below, then reused on later runs so the deployment stays idempotent.
reverse_proxy_basic_auth_user: observer
reverse_proxy_hash_file: /etc/caddy/.basic_auth_hash
