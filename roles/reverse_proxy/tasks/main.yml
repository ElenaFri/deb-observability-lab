---
- name: Assert the host runs a Debian-based distribution
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: >-
      The reverse_proxy role only supports Debian-based systems,
      but os_family is {{ ansible_facts['os_family'] | default('unknown') }}.
    quiet: true

- name: Assert a basic-auth password was provided
  ansible.builtin.assert:
    that:
      - reverse_proxy_basic_auth_password is defined
      - reverse_proxy_basic_auth_password | length > 0
    fail_msg: >-
      reverse_proxy_basic_auth_password must be set (for example in a git-ignored
      secrets.local.yml or via Ansible Vault). The role ships no default password.
    quiet: true

- name: Install Caddy
  ansible.builtin.apt:
    name: "{{ reverse_proxy_package }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ reverse_proxy_apt_cache_valid_time }}"

# The bcrypt hash is generated once by Caddy's own tool (guaranteeing the exact
# format the Caddyfile expects) and then reused, which keeps the play idempotent:
# bcrypt uses a random salt, so re-hashing every run would rewrite the Caddyfile.
# The password is fed on stdin, never on the command line. To rotate the password,
# remove this file and redeploy.
- name: Generate the basic-auth hash once
  ansible.builtin.shell:
    cmd: "set -o pipefail; caddy hash-password | tail -n1 > {{ reverse_proxy_hash_file }}"
    stdin: "{{ reverse_proxy_basic_auth_password }}"
    creates: "{{ reverse_proxy_hash_file }}"
  no_log: true

- name: Secure the basic-auth hash file
  ansible.builtin.file:
    path: "{{ reverse_proxy_hash_file }}"
    owner: root
    group: caddy
    mode: "0640"

- name: Read the basic-auth hash
  ansible.builtin.slurp:
    src: "{{ reverse_proxy_hash_file }}"
  register: reverse_proxy_hash
  changed_when: false

- name: Expose the basic-auth hash for the template
  ansible.builtin.set_fact:
    reverse_proxy_basic_auth_hash: "{{ reverse_proxy_hash.content | b64decode | trim }}"
  no_log: true

- name: Deploy the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ reverse_proxy_config_file }}"
    owner: root
    group: caddy
    # Read by the caddy service user at config load; contains only the bcrypt hash.
    mode: "0640"
  no_log: true
  notify: Reload caddy

- name: Validate the Caddy configuration
  ansible.builtin.command:
    cmd: "caddy validate --adapter caddyfile --config {{ reverse_proxy_config_file }}"
  changed_when: false

- name: Ensure Caddy is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ reverse_proxy_service }}"
    enabled: true
    state: started
