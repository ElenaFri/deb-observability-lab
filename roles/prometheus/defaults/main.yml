---
prometheus_package: prometheus
prometheus_service: prometheus
prometheus_config_file: /etc/prometheus/prometheus.yml
prometheus_apt_cache_valid_time: 3600
prometheus_scrape_interval: 15s
prometheus_evaluation_interval: 15s
prometheus_node_exporter_port: "{{ node_exporter_port | default(9100) }}"

# Alerting (Milestone 4). Alerts fire inside Prometheus and are visible on /alerts;
# routing and notifications are deferred to the optional Alertmanager milestone.
prometheus_rules_dir: /etc/prometheus/rules
prometheus_alert_instance_down_for: 1m
prometheus_alert_resource_for: 5m
prometheus_alert_cpu_threshold: 85
prometheus_alert_memory_threshold: 85
prometheus_alert_disk_threshold: 85

# Alertmanager integration (Milestone 5). Disabled by default to keep the role usable
# on its own; enabled lab-wide in inventory/group_vars/all.yml.
prometheus_alertmanager_enabled: false
prometheus_alertmanager_target: "localhost:9093"
