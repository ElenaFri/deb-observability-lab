---
- name: Assert the host runs a Debian-based distribution
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: >-
      The prometheus role only supports Debian-based systems,
      but os_family is {{ ansible_facts['os_family'] | default('unknown') }}.
    quiet: true

- name: Install Prometheus from Debian packages
  ansible.builtin.apt:
    name: "{{ prometheus_package }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ prometheus_apt_cache_valid_time }}"

- name: Configure Prometheus scrape targets
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_file }}"
    owner: root
    group: prometheus
    mode: "0640"
    validate: "promtool check config %s"
  notify: Reload Prometheus

- name: Ensure Prometheus is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ prometheus_service }}"
    enabled: true
    state: started
