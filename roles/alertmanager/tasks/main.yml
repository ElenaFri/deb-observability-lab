---
- name: Assert the host runs a Debian-based distribution
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: >-
      The alertmanager role only supports Debian-based systems,
      but os_family is {{ ansible_facts['os_family'] | default('unknown') }}.
    quiet: true

- name: Install Alertmanager from Debian packages
  ansible.builtin.apt:
    name: "{{ alertmanager_package }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ alertmanager_apt_cache_valid_time }}"

- name: Configure Alertmanager routing
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ alertmanager_config_file }}"
    owner: root
    group: prometheus
    mode: "0640"
    validate: "amtool check-config %s"
  notify: Restart Alertmanager

- name: Ensure Alertmanager is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ alertmanager_service }}"
    enabled: true
    state: started
