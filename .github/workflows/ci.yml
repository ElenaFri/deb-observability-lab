---
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Ansible project
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation tools
        run: python -m pip install -r requirements-dev.txt

      - name: Lint YAML
        run: yamllint .

      - name: Lint Ansible
        run: ansible-lint

      - name: Check playbook syntax
        run: |
          ansible-playbook --syntax-check playbooks/site.yml
          ansible-playbook --syntax-check playbooks/deploy-node-exporter.yml
          ansible-playbook --syntax-check playbooks/deploy-prometheus.yml
          ansible-playbook --syntax-check playbooks/deploy-grafana.yml

      - name: Run connectivity playbook in check mode
        run: ansible-playbook --check --diff playbooks/site.yml
