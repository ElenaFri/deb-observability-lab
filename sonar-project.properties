# SonarCloud / SonarQube Cloud analysis configuration.
#
# Scope exclusions. These paths are intentionally kept out of the quality gate:
#
#   tests/smoke/**   Smoke tests deliberately use clear-text http:// to probe a
#                    non-routable lab VM (for example to assert an HTTP->HTTPS
#                    redirect). The "clear-text protocol" hotspot does not apply
#                    to a local test harness that never touches an untrusted
#                    network.
#
#   .github/**       CI dev-tooling. Installing pinned dev dependencies from
#                    requirements-dev.txt in an ephemeral GitHub Actions runner
#                    is not a production supply-chain surface.
#
# Real Ansible code under roles/ is NOT excluded; those findings were fixed in
# the code itself.
#
# Note: with SonarCloud Automatic Analysis (no CI scanner) the reliable place
# for these exclusions is the project UI (Administration -> Analysis Scope ->
# Source File Exclusions). This file documents the intent and is honoured by any
# scanner-based analysis.
sonar.exclusions=tests/smoke/**,.github/**
